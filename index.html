<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Điểm Firebase</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>📊 Quản Lý Điểm Sinh Viên (Firebase)</h1>

<div class="form">
    <input type="text" id="name" placeholder="Tên sinh viên">
    <input type="number" id="math" placeholder="Điểm Toán">
    <input type="number" id="physics" placeholder="Điểm Lý">
    <input type="number" id="chemistry" placeholder="Điểm Hóa">
    <button id="addBtn">Thêm sinh viên</button>

    <table>
        <thead>
            <tr>
                <th>Tên</th>
                <th>Toán</th>
                <th>Lý</th>
                <th>Hóa</th>
                <th>TB</th>
                <th>Xóa</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<!-- Firebase + JS -->
<script type="module" src="js/script.js"></script>
</body>
</html>
